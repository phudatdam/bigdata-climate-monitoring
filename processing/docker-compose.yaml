services:
  processor:
    build:
      context: ..
      dockerfile: processing/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPICS: weather.raw.stream,air_quality.raw.stream
      KAFKA_STARTING_OFFSETS: latest
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: climate_db
      MONGODB_LIVE_COLLECTION: realtime_observations
      MONGODB_HISTORY_COLLECTION: climate_observations
      SPARK_CHECKPOINT_DIR: /var/lib/climate/checkpoint
      PYSPARK_PYTHON: python
      PYSPARK_DRIVER_PYTHON: python
    volumes:
      - ../checkpoint/processing:/var/lib/climate/checkpoint
      - ../exports:/workspace/exports:ro
    networks:
      - ingestion

  historical-batch:
    build:
      context: ..
      dockerfile: processing/Dockerfile
    environment:
      SPARK_MASTER: ${SPARK_MASTER:-local[1]}
      SPARK_SQL_SHUFFLE_PARTITIONS: ${SPARK_SQL_SHUFFLE_PARTITIONS:-8}
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: climate_db
      MONGODB_HISTORY_COLLECTION: climate_observations
      PYSPARK_PYTHON: python
      PYSPARK_DRIVER_PYTHON: python
    volumes:
      - ../exports:/workspace/exports:ro
      - ../archive:/workspace/archive
      - ../logs/benchmarks:/workspace/benchmark-reports
      - historical_ivy_cache:/root/.ivy2
    networks:
      - ingestion
    entrypoint: ["python", "-m", "processing.batch.historical_flow"]

networks:
  ingestion:
    external: true
    name: ingestion_kafka_network

volumes:
  historical_ivy_cache:
